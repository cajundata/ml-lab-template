[project]
name = "ml-lab-template"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "boto3",
  "joblib",
  "mlflow",
  "numpy",
  "pandas",
  "scikit-learn",
  "typer",
  "python-dotenv",
  "requests>=2.34.2",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml"
]

[project.scripts]
ml-lab = "ml_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
